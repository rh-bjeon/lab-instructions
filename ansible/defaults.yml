---
# Pin module execution to the exact interpreter running ansible-playbook itself
# (our plays are hosts: localhost / connection: local), instead of leaving it to
# Ansible's interpreter auto-discovery -- which can silently pick a different
# python3 than the one ansible-core itself depends on, especially on RHEL hosts
# where multiple python3.x streams coexist (default stream vs AppStream
# alternatives like python3.11/python3.12).
ansible_python_interpreter: "{{ ansible_playbook_python }}"

# Student OpenShift usernames follow "<student_username_prefix><N>", e.g. user1, user2, ...
student_username_prefix: user
student_start_index: 1

# Placeholder only -- override with `-e default_password=...` (or Ansible Vault) at run time.
default_password: "ChangeMe123!"

# Per-student password overrides, e.g. -e password_overrides='{"user7":"special-pass"}'
password_overrides: {}

# Most Gitea instances in this environment follow "gitea-gitea.<cluster ingress domain>"
# (the same convention docs/index.html already used). Override only if a given cluster differs.
gitea_console_url: "gitea-gitea.{{ openshift_cluster_ingress_domain }}"

# Lab guide content source -- override with -e content_git_repo_url=... / -e content_git_repo_ref=...
content_git_repo_url: "https://github.com/rh-bjeon/lab-instructions.git"
content_git_repo_ref: main

# Generic images used for every student -- no custom image build. See docs/index.html.
git_cloner_image: "quay.io/rhpds/git-cloner:v1.1.5"
labguide_nginx_image: "registry.access.redhat.com/ubi9/nginx-124"

# Optional overrides for non-default kubeconfig/context. Left unset by default so the
# ambient ~/.kube/config (already authenticated to the cluster) and its current-context are used.
# k8s_kubeconfig: ~/.kube/config
# k8s_context: my-context

# --- workshop-ui (single shared Deployment, not looped per student) ---
workshop_ui_namespace: workshop-ui
workshop_ui_image: "registry.access.redhat.com/ubi9/python-312"
workshop_ui_pvc_size: 1Gi
# workshop_ui_admin_password has NO default -- deploy-workshop-ui.yml asserts it was
# passed via -e, since unlike default_password this guards the whole assignment table.
# workshop_ui_secret_key is auto-generated per run if not passed via -e (sessions won't
# survive a redeploy in that case -- pass -e workshop_ui_secret_key=... for stability).
