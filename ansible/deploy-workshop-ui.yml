---
# Deploys the single, shared workshop directory/login app (not looped per
# student -- one Deployment for the whole workshop/cluster).
#
# Example:
#   ansible-playbook ansible/deploy-workshop-ui.yml \
#     -e workshop_ui_admin_password='some-strong-password'
#
# Run from the same host/account as deploy-labguide.yml (ambient ~/.kube/config).
- name: Deploy the workshop directory/login app
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - defaults.yml
  vars:
    workshop_ui_secret_key: "{{ workshop_ui_secret_key | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits')) }}"

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - workshop_ui_admin_password is defined
          - workshop_ui_admin_password | length > 0
        fail_msg: >-
          workshop_ui_admin_password is required (it has no insecure default),
          e.g. -e workshop_ui_admin_password='some-strong-password'

    - name: Ensure namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
        context: "{{ k8s_context | default(omit) }}"
        state: present
        definition: "{{ lookup('template', 'templates/workshop-ui-namespace.yaml.j2') }}"

    - name: Apply PVC for the SQLite database
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
        context: "{{ k8s_context | default(omit) }}"
        state: present
        definition: "{{ lookup('template', 'templates/workshop-ui-pvc.yaml.j2') }}"

    - name: Apply Secret (ADMIN_PASSWORD, SECRET_KEY)
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
        context: "{{ k8s_context | default(omit) }}"
        state: present
        definition: "{{ lookup('template', 'templates/workshop-ui-secret.yaml.j2') }}"

    - name: Apply Deployment
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
        context: "{{ k8s_context | default(omit) }}"
        state: present
        definition: "{{ lookup('template', 'templates/workshop-ui-deployment.yaml.j2') }}"

    - name: Apply Service
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
        context: "{{ k8s_context | default(omit) }}"
        state: present
        definition: "{{ lookup('template', 'templates/workshop-ui-service.yaml.j2') }}"

    - name: Apply Route
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
        context: "{{ k8s_context | default(omit) }}"
        state: present
        definition: "{{ lookup('template', 'templates/workshop-ui-route.yaml.j2') }}"
